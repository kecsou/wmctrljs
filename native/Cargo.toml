[package]
name = "wmctrljs"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = { version = "1", features = ["preserve_order"] }
x11rb = "0.14"

# Nothing may panic or use unsafe outside tests (clippy.toml relaxes the panic lints in tests,
# lib.rs forbids unsafe outside them). CI runs clippy with -D warnings.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
arithmetic_side_effects = "forbid"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
# Size over speed: X round trips dominate, and every target ships in the package.
# Not "z": it breaks x11rb's packet reader on ppc64le (empty packet panic).
opt-level = "s"
codegen-units = 1
